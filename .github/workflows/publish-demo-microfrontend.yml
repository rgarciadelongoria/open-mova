name: Publicar microfrontal demo

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del tag
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: open-mova-mf-template/package-lock.json

      - name: Instalar dependencias del microfrontal
        run: npm ci --include=optional
        working-directory: open-mova-mf-template

      - name: Reinstalar binarios nativos de Linux
        # npm puede omitir dependencias opcionales de otra plataforma del lockfile.
        # Esta instalación explícita evita que Native Federation falle al cargar sus bindings.
        run: >
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
          @napi-rs/lzma-linux-x64-gnu@1.5.1
          @napi-rs/nice-linux-x64-gnu@1.1.1
          @oxc-parser/binding-linux-x64-gnu@0.149.0
          @rolldown/binding-linux-x64-gnu@1.0.0-rc.4
          @rollup/rollup-linux-x64-gnu@4.63.2
        working-directory: open-mova-mf-template

      - name: Comprobar binarios nativos de Linux
        run: |
          test -d node_modules/@oxc-parser/binding-linux-x64-gnu
          test -d node_modules/@rolldown/binding-linux-x64-gnu
          test -d node_modules/@rollup/rollup-linux-x64-gnu
          test -d node_modules/@napi-rs/nice-linux-x64-gnu
          test -d node_modules/@napi-rs/lzma-linux-x64-gnu
        working-directory: open-mova-mf-template

      - name: Compilar el microfrontal demo
        run: npm run build
        working-directory: open-mova-mf-template

      - name: Comprobar el artefacto federado
        run: test -f dist/browser/remoteEntry.json
        working-directory: open-mova-mf-template

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar el artefacto de la demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: open-mova-mf-template/dist/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
